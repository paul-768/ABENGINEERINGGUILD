<!-- Notification Bell Component -->
<div class="relative" x-data="{ open: false }">
    <button @click="open = !open" 
            class="p-2 text-gray-400 hover:text-gray-500 transition-colors relative">
        <i class="fas fa-bell text-xl"></i>
        {% if current_user.get_unread_notifications_count() > 0 %}
            <span class="notification-badge absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
                {{ current_user.get_unread_notifications_count() }}
            </span>
        {% endif %}
    </button>

    <!-- Dropdown -->
    <div x-show="open" 
         @click.away="open = false"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-75"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg ring-1 ring-black ring-opacity-5 z-50 max-h-96 overflow-y-auto">
        
        <!-- Header -->
        <div class="p-4 border-b border-gray-200">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-900">Notifications</h3>
                <a href="/notifications" 
                   class="text-sm text-blue-600 hover:text-blue-500">
                    View all
                </a>
            </div>
        </div>

        <!-- Notifications List -->
        <div class="p-2" id="notification-dropdown-list">
            <!-- Notifications will be loaded via JavaScript -->
            <div class="text-center py-4 text-gray-500">
                <i class="fas fa-spinner fa-spin"></i>
                Loading...
            </div>
        </div>

        <!-- Footer -->
        <div class="p-2 border-t border-gray-200 bg-gray-50">
            <button onclick="markAllAsRead()"
                    class="w-full text-center py-2 text-sm text-gray-600 hover:text-gray-800 transition-colors">
                <i class="fas fa-check-double mr-1"></i>
                Mark all as read
            </button>
        </div>
    </div>
</div>

<script>
// Load notifications for dropdown - NO LIMIT (shows all)
async function loadNotificationDropdown() {
    try {
        // Removed the limit parameter to fetch ALL notifications
        const response = await fetch('/notifications/api/notifications');
        const data = await response.json();
        
        const container = document.getElementById('notification-dropdown-list');
        
        if (data.notifications.length === 0) {
            container.innerHTML = `
                <div class="text-center py-4 text-gray-500">
                    <i class="fas fa-bell-slash text-2xl mb-2"></i>
                    <p class="text-sm">No notifications</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = data.notifications.map(notification => `
            <div class="p-3 hover:bg-gray-50 rounded-lg transition-colors ${notification.is_read ? '' : 'bg-blue-50'} cursor-pointer"
                 onclick="handleNotificationClick(${notification.id}, '${notification.action_url}')">
                <div class="flex items-start space-x-3">
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-${getNotificationColor(notification.type)}-100 flex items-center justify-center">
                        <i class="${notification.icon} text-${getNotificationColor(notification.type)}-600 text-sm"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-900">${escapeHtml(notification.title)}</p>
                        <p class="text-xs text-gray-600 mt-1">${escapeHtml(notification.message)}</p>
                        <p class="text-xs text-gray-400 mt-1">${notification.time_ago}</p>
                    </div>
                    <div class="flex-shrink-0">
                        ${!notification.is_read ? `
                            <button onclick="event.stopPropagation(); markDropdownNotificationAsRead(${notification.id})" 
                                    class="text-gray-400 hover:text-green-600 transition-colors"
                                    title="Mark as read">
                                <i class="fas fa-check-circle text-xs"></i>
                            </button>
                        ` : ''}
                    </div>
                </div>
            </div>
        `).join('');
        
    } catch (error) {
        console.error('Error loading notifications:', error);
    }
}

function getNotificationColor(type) {
    const colorMap = {
        // Rank & Achievements
        'rank_milestone': 'yellow',
        'rank_number_one': 'yellow',
        'achievement': 'green',
        'goal_completed': 'green',
        
        // Quiz Results
        'quiz_complete': 'green',
        'quiz_result': 'green',
        
        // Performance Alerts
        'weak_area_alert': 'blue',
        'improvement_alert': 'green',
        'study_reminder': 'blue',
        'study_suggestion': 'blue',
        
        // Social
        'friend_request': 'purple',
        'friend_request_accepted': 'purple',
        'message': 'blue',
        'like': 'pink',
        'comment': 'indigo',
        'post_reply': 'indigo',
        
        // Announcements
        'announcement': 'red'
    };
    return colorMap[type] || 'gray';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function handleNotificationClick(notificationId, actionUrl) {
    // Mark as read
    fetch('/notifications/api/notifications/read', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ notification_id: notificationId })
    }).catch(error => console.error('Error:', error));
    
    // Redirect if URL exists
    if (actionUrl && actionUrl !== 'None' && actionUrl !== 'null') {
        window.location.href = actionUrl;
    }
}

async function markDropdownNotificationAsRead(notificationId) {
    try {
        const response = await fetch('/notifications/api/notifications/read', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ notification_id: notificationId })
        });
        
        const data = await response.json();
        if (data.success) {
            await loadNotificationDropdown();
            await updateNotificationBadge();
        }
    } catch (error) {
        console.error('Error:', error);
    }
}

async function markAllAsRead() {
    try {
        const response = await fetch('/notifications/api/notifications/read', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ notification_id: 'all' })
        });
        
        const data = await response.json();
        if (data.success) {
            await loadNotificationDropdown();
            await updateNotificationBadge();
        }
    } catch (error) {
        console.error('Error:', error);
    }
}

// Load notifications when dropdown opens
document.addEventListener('alpine:init', () => {
    Alpine.data('notificationDropdown', () => ({
        open: false,
        init() {
            this.$watch('open', (value) => {
                if (value) {
                    loadNotificationDropdown();
                }
            });
        }
    }));
});

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    // Update notification badge periodically
    setInterval(updateNotificationBadge, 30000); // Every 30 seconds
    updateNotificationBadge();
});

async function updateNotificationBadge() {
    try {
        const response = await fetch('/notifications/api/notifications?unread_only=true');
        const data = await response.json();
        
        const badge = document.querySelector('.notification-badge');
        if (badge) {
            if (data.unread_count > 0) {
                badge.textContent = data.unread_count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }
    } catch (error) {
        console.error('Error updating notification badge:', error);
    }
}
</script>
