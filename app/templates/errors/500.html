<!-- app/templates/errors/500.html -->
{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="text-center">
        <div class="mb-8">
            <i class="fas fa-exclamation-triangle text-8xl text-red-500"></i>
        </div>
        <h1 class="text-6xl font-bold text-gray-800 mb-4">500</h1>
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">Server Error</h2>
        <p class="text-gray-500 mb-8">Something went wrong on our end. Please try again later.</p>
        <a href="{{ url_for('main.index') }}" class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
            <i class="fas fa-home mr-2"></i> Back to Home
        </a>
    </div>
</div>
{% endblock %}
